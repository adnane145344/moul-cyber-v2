services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moul_cyber
      POSTGRES_USER: moul_cyber
      POSTGRES_PASSWORD: moul_cyber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moul_cyber -d moul_cyber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
